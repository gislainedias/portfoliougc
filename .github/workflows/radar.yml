name: Radar de novidades

on:
  schedule:
    - cron: "0 9 * * *"   # todo dia às 6h da manhã (horário de Brasília)
  workflow_dispatch:        # permite rodar na hora, pelo botão "Run workflow"
  push:                     # também roda sozinho quando esta rotina é alterada
    paths:
      - "radar/buscar.mjs"
      - ".github/workflows/radar.yml"

permissions:
  contents: write

jobs:
  buscar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Buscar novidades
        run: node radar/buscar.mjs
      - name: Salvar se mudou
        run: |
          git config user.name "radar-de-novidades"
          git config user.email "radar@users.noreply.github.com"
          git add radar/novidades.json
          git diff --cached --quiet || (git commit -m "Radar: novidades do dia" && git push)
